bind r source-file ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:hyperlinks"
set -as terminal-features ",wezterm*:clipboard:ccolour:cstyle:focus:title:RGB:hyperlinks"
set -sg escape-time 0

# Enable xterm-keys to pass through Ctrl+arrow keys and other shortcuts
# set-window-option -g xterm-keys on

unbind-key C-b
set -g prefix 'C-s'
bind-key 'C-s' send-prefix


# Rename your terminals
set -g set-titles on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
set -g copy-command 'tmux load-buffer -w -'


unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"


# set -g status-utf8 on
set -g status-bg black
set -g status-fg white
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
set-option -g default-shell /bin/zsh

set -g @resurrect-save 'S'


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'


# set-option -sa terminal-overrides ',alacritty:RGB'

set -g mouse on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel

run '/usr/share/tmux-plugin-manager/tpm'
set -g focus-events on
